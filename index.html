<style>
/* 紙の地図：海は淡い青、陸は生成り、通った道は朱色の線 */
:root{
  --bg:#dbe8ef; --paper:#fffdf7; --ink:#26323a; --ink2:#5f6f78; --line:#26323a22;
  --land:#f6f0e1; --edge:#8a8170; --sea:#cfe1ea; --route:#d2492f; --route2:#9b3220; --go:#2f8a5b; --goal:#d2492f; --nb:#ffe7a3; --gold:#d79b2c;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:12px;min-height:100%;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
h1{font-weight:800;font-size:21px;margin:0;letter-spacing:.04em}
h1 small{font-size:12px;letter-spacing:0;color:var(--ink2);margin-left:8px;font-weight:500}
.icon{all:unset;cursor:pointer;font-size:18px;min-width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);box-sizing:border-box;padding:0 8px;background:var(--paper)}
.icon:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.dots{display:flex;gap:6px;flex:1;max-width:120px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--route)}.dots i.done{background:var(--ink)}
button.main,a.main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;background:var(--route);color:#fff;font-weight:800;font-size:17px;padding:0 16px;text-align:center;box-shadow:0 4px 0 var(--route2)}
button.main:active{transform:translateY(2px);box-shadow:0 2px 0 var(--route2)}
button.main.alt{background:#2f5d7a;box-shadow:0 4px 0 #1d3d52}
button.sub,a.sub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:800;font-size:15px;padding:0 12px;text-align:center}
button.sub:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}
.note{color:var(--ink2);font-size:13px;line-height:1.6;margin:0;text-align:center}
.note a{color:var(--route2);display:inline-flex;align-items:center;min-height:44px}
/* 地図 */
.map{background:var(--sea);border-radius:16px;overflow:hidden;border:2px solid #2f5d7a33;touch-action:manipulation;position:relative}
.map svg{display:block;width:100%;height:auto}
.map path{fill:var(--land);stroke:var(--edge);stroke-width:.7;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.map path.nb{fill:var(--nb);cursor:pointer}
.map path.v{fill:#f3c9b9}
.map path.s{fill:#bfe3cc}
.map path.g{fill:#f6b3a5}
.map path.x{fill:url(#hatch)}
.map path.hint{fill:#ffd36b;animation:blink 1s 3}
@keyframes blink{50%{fill:#fff3c9}}
.map .rt{fill:none;stroke:var(--route);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.map .lk{stroke:#2f5d7a;stroke-width:1.6;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.map text{font-family:var(--f-body);font-weight:800;paint-order:stroke;stroke:#fffdf7;stroke-width:3px;fill:var(--ink);text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.map .pin{stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke}
.map.hide svg{display:none}
.map .blind{display:none;padding:26px 12px;text-align:center;color:var(--ink2);font-size:14px}
.map.hide .blind{display:block}
.trip{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:14px;line-height:1.5}
.trip b{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:1px 6px}
.trip b.s{border-color:var(--go);color:var(--go)}
.trip b.c{border-color:var(--route);color:var(--route2)}
.trip i{font-style:normal;color:var(--ink2)}
.goal{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--paper);border-radius:14px;padding:10px 12px;border:1px solid var(--line);font-size:15px}
.goal b{font-size:18px}
.goal .from{color:var(--go)}.goal .to{color:var(--route2)}
.nexts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nexts button{all:unset;box-sizing:border-box;cursor:pointer;min-height:48px;border-radius:12px;background:var(--paper);border:2px solid #e9c46a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:15px;text-align:center;padding:2px 4px;line-height:1.2}
.nexts button small{font-size:10px;color:var(--ink2);font-weight:500}
.nexts button.hint{background:#ffe7a3}
.nexts button:disabled{border-color:var(--line);color:var(--ink2);cursor:default;background:repeating-linear-gradient(45deg,#0000 0 6px,#26323a10 6px 9px)}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink2);min-height:22px}
.verdict{background:var(--paper);border:2px solid #2f5d7a;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 #26323a1c;animation:up .35s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.verdict .hd{display:flex;justify-content:center;align-items:baseline;gap:10px;font-size:22px;font-weight:800}
.stars{color:var(--gold);letter-spacing:.1em;font-size:20px}
.stars .off{color:#26323a26}
/* ホーム */
.title{font-weight:800;font-size:36px;letter-spacing:.06em;text-align:center;margin:4px 0 0}
.lead{text-align:center;color:var(--ink2);margin:0;font-size:14px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:20px}
.stats small{color:var(--ink2);font-size:12px}
.rank{text-align:center;font-size:13px;color:var(--route2)}
.share{background:var(--paper);border-radius:14px;padding:12px;white-space:pre-line;font-size:15px;line-height:1.6;text-align:center;border:1px solid var(--line)}
.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shares a,.shares button{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;font-weight:800;text-decoration:none;padding:0 6px;box-sizing:border-box;font-family:inherit;cursor:pointer}
.big{font-weight:800;font-size:24px;text-align:center;margin:0}
.res{display:flex;flex-direction:column;gap:6px}
.res div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.lv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* 県帳 */
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dex div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;font-size:13px;min-height:44px;display:flex;flex-direction:column;justify-content:center;box-sizing:border-box}
.dex div small{font-size:11px;color:var(--ink2)}
.dex .no{opacity:.45}
dialog{border:none;border-radius:18px;background:var(--paper);color:var(--ink);max-width:400px;width:calc(100% - 32px);padding:20px;box-sizing:border-box}
dialog::backdrop{background:#000000aa}
dialog h2{margin:0 0 10px;letter-spacing:.06em}
dialog ol{padding-left:1.3em;margin:0 0 12px;line-height:1.8}
dialog p{margin:0 0 10px;font-size:14px;line-height:1.7;color:var(--ink2)}
dialog a{color:var(--route2);min-height:44px;display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;z-index:9;box-shadow:0 6px 20px #0005;max-width:90%;text-align:center}
footer{margin-top:auto;text-align:center;font-size:12px;color:var(--ink2);display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
footer a{color:var(--ink2);min-height:44px;display:inline-flex;align-items:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<dialog id="howto" aria-labelledby="howto-t">
  <h2 id="howto-t">遊び方</h2>
  <ol>
    <li>緑の県から出発して、赤い県をめざします。</li>
    <li>進めるのは、いまいる県のとなりの県だけ。地図の黄色い県か、下のボタンを押して進みます。</li>
    <li>いちばん少ない県の数で着けば★3つ。「ひとつ戻る」で戻れますが、進んだ回数は減りません。</li>
  </ol>
  <p>海をこえるのは、橋とトンネルでつながる5か所だけ（青函トンネル・関門トンネル・明石海峡大橋・瀬戸大橋・しまなみ海道）。沖縄県は橋やトンネルでつながっていないので出てきません。</p>
  <p>今日の3問はだれでも同じで1日1回。時間制限はありません。</p>
  <p><a id="fb2" target="_blank" rel="noopener">感想を送る</a></p>
  <button class="main" id="howto-ok" style="width:100%">わかった</button>
</dialog>
<script src="map.js"></script>
<script src="gen.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id), app = $("app");
const SITE = "https://satou-aaaaa.github.io/todofuken-relay/";
const FEEDBACK = "https://github.com/satou-aaaaa/todofuken-relay/issues/new?template=feedback.yml";
const KEY = "todofuken-v1", EPOCH = "2026-11-04";
const T = window.TDR, M = T.M, NB = M.N;

// ---- 日付と種（日本時間。だれでも同じ3問）----
const jstNow = () => new Date(Date.now() + 9 * 3600e3);
const todayKey = () => jstNow().toISOString().slice(0, 10);
const dayNo = (k) => Math.round((Date.parse(k) - Date.parse(EPOCH)) / 864e5) + 1;
const lvOf = (lv) => (lv === 3 ? T.HARD : T.LV[lv]);
// 今日の3問：近場・遠出・通行止め。上級：地図なしの2問（ヒントなし）
const dailyList = (k) => T.LV.map((L, i) => ({ seed: T.seedOf(k + ":d:" + i), lv: i }));
const hardList = (k) => [0, 1].map((i) => ({ seed: T.seedOf(k + ":h:" + i), lv: 3 }));
const cache = new Map();
const probOf = (it) => { const k = it.seed + ":" + it.lv; if (!cache.has(k)) cache.set(k, T.make(it.seed, lvOf(it.lv))); return cache.get(k); };
// ★：最短で着けば3、2県まで遠回りで2、それより多いと1。ヒント1回ごとに1つ減る（最低1）
const starsOf = (r) => Math.max(1, (r.m === r.d ? 3 : r.m - r.d <= 2 ? 2 : 1) - (r.h || 0));
const starStr = (s) => `<span class="stars" aria-label="星${s}つ">${"★".repeat(s)}<span class="off">${"★".repeat(3 - s)}</span></span>`;

// ---- 記録（この端末の localStorage だけ）----
// 進行中の遊びはモードごとに分けて持つ（練習を始めても今日・上級の途中経過を消さない）。seen：県 → 通った回数
const fresh = () => ({ v: 1, days: {}, hdays: {}, seen: {}, trips: 0, runs: {}, tut: false, kofi: {} });
let MODE = "d";
let mem = null; // 保存できない環境では、開いているあいだだけここに置く
// 保存に失敗したあとはメモリと保存の両方を読む。記録（日ごとの結果・県帳）は合わせて数は高いほう、途中経過は同じ日・同じ問題なら進んだほう
const doneOf = (r) => !!r && r.res.length >= r.list.length, recOf = (r) => ({ r: r.res.map((x) => ({ m: x.m, d: x.d, h: x.h })) });
// 終わった今日・上級の回を日ごとの記録に入れる（結果を見る前に別のタブが次の日を保存しても、終えた日を失わない）
function bank(s, r) { const b = doneOf(r) ? (r.mode === "d" ? s.days : r.mode === "h" ? s.hdays : null) : null; if (!b || b[r.date]) return false; b[r.date] = recOf(r); return true; }
function load() { let a = null, b = null; try { b = JSON.parse(localStorage.getItem(KEY)); } catch (e) {} try { a = mem !== null ? JSON.parse(mem) : null; } catch (e) {} if (a && a.v !== 1) a = null; if (b && b.v !== 1) b = null; if (!a || !b) return Object.assign(fresh(), a || b || {}); const [n, o] = (a.t || 0) >= (b.t || 0) ? [a, b] : [b, a]; const s = Object.assign(fresh(), n); for (const k in o) { if (k === "runs" || k === "t") continue; const x = o[k], y = n[k]; if (x && y && typeof x === "object" && typeof y === "object") { s[k] = Object.assign({}, x, y); for (const q in x) if (typeof x[q] === "number" && typeof y[q] === "number") s[k][q] = Math.max(x[q], y[q]); } else if (typeof x === "number" && typeof y === "number") s[k] = Math.max(x, y); else if (x === true) s[k] = true; } const ra = a.runs || {}, rb = b.runs || {}, prog = (r) => (r.res ? r.res.length : 0) * 1000 + (r.cur && r.cur.moves ? r.cur.moves : 0), idOf = (r) => JSON.stringify([r.list || null, r.id || null]); s.runs = Object.assign({}, n.runs); for (const m of new Set([...Object.keys(ra), ...Object.keys(rb)])) { const x = ra[m], y = rb[m]; if (x === undefined || y === undefined) { if (x || y) s.runs[m] = x || y; continue; } if (!x || !y) { const r = x || y; if (!r || bank(s, r) || doneOf(r)) continue; const bd = r.mode === "d" ? s.days : r.mode === "h" ? s.hdays : null; if (bd && !bd[r.date]) s.runs[m] = r; continue; } if (x.date !== y.date) { const [w, l] = x.date > y.date ? [x, y] : [y, x]; bank(s, l); s.runs[m] = w; } else if (idOf(x) === idOf(y)) { const px = prog(x), py = prog(y); s.runs[m] = px > py ? x : py > px ? y : n.runs[m]; } } return s; }
// 保存の前に読み直す（別のタブで進めた記録を消さない）
function save(fn) { const s = load(); fn(s); s.t = Math.max(Date.now(), (s.t || 0) + 1); const j = JSON.stringify(s); try { localStorage.setItem(KEY, j); mem = null; } catch (e) { mem = j; } return s; }
const prevDay = (k) => new Date(Date.parse(k) - 864e5).toISOString().slice(0, 10);
function streak(days) { let k = todayKey(), n = 0; if (!days[k]) k = prevDay(k); while (days[k]) { n++; k = prevDay(k); } return n; }
const RANKS = [[0, "旅のはじめ"], [10, "となり町の旅人"], [40, "県境さがし"], [120, "列島の旅人"], [300, "地図の達人"]];
const rankOf = (n) => RANKS.filter((r) => n >= r[0]).pop()[1];
const nextRank = (n) => RANKS.find((r) => r[0] > n);

// ---- 画面 ----
const md = (k) => `${+k.slice(5, 7)}/${+k.slice(8, 10)}`;
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }
const buzz = (n = 12) => { try { navigator.vibrate && navigator.vibrate(n); } catch (e) {} };
const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const footer = () => `<footer><a href="#" id="f-how">遊び方</a><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a><a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi で応援</a></footer>`;
function bindFooter() { const h = $("f-how"); if (h) h.onclick = (e) => { e.preventDefault(); openHow(); }; }
function openHow() { $("fb2").href = FEEDBACK; const d = $("howto"); if (d.showModal) d.showModal(); else d.setAttribute("open", ""); }
$("howto-ok").onclick = () => { const d = $("howto"); d.close ? d.close() : d.removeAttribute("open"); save((s) => { s.tut = true; }); };
const linkOf = (a, b) => M.L.find((l) => (l[0] === a && l[1] === b) || (l[0] === b && l[1] === a));

// 地図を描く。focus の県が全部入るように寄る。opt：{ path, cur, nb:[となり], hint, p }
function mapHtml(p, opt = {}) {
  const path = opt.path || [], focus = new Set([p.s, p.g, ...p.closed, ...path, ...(opt.nb || []), ...(opt.extra || [])]);
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const i of focus) { const [, , x, y] = M.P[i]; x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  const pad = 34; x0 -= pad; y0 -= pad; x1 += pad; y1 += pad;
  // 縦横の比を 1:0.8 に近づける（小さく寄りすぎない）
  let w = Math.max(x1 - x0, 150), h = Math.max(y1 - y0, 120); if (h < w * 0.8) h = w * 0.8; if (w < h / 1.1) w = h / 1.1;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2; x0 = cx - w / 2; y0 = cy - h / 2;
  if (opt.full) { x0 = 0; y0 = 0; w = M.W; h = M.H; }
  const k = w / 360, fs = Math.max(7, 12 * k); // 字の大きさは画面で12pxくらい
  const cls = (i) => i === p.s ? "s" : i === p.g ? "g" : p.closed.includes(i) ? "x" : i === opt.hint ? "hint" : path.includes(i) ? "v" : (opt.nb || []).includes(i) ? "nb" : "";
  const paths = M.P.map((q, i) => `<path d="${q[1]}" class="${cls(i)}" data-i="${i}"><title>${q[0]}</title></path>`).join("");
  const links = M.L.map((l) => { const a = M.P[l[0]], b = M.P[l[1]]; return `<line class="lk" x1="${a[2]}" y1="${a[3]}" x2="${b[2]}" y2="${b[3]}"/>`; }).join("");
  const rt = path.length > 1 ? `<polyline class="rt" points="${path.map((i) => M.P[i][2] + "," + M.P[i][3]).join(" ")}"/>` : "";
  const labels = [...new Set([p.s, p.g, ...p.closed, ...path, ...(opt.nb || [])])].map((i) => `<text x="${M.P[i][2]}" y="${M.P[i][3] - (i === opt.cur ? fs * 1.1 : 0)}" font-size="${fs}">${p.closed.includes(i) ? "✕" : ""}${T.short(i)}</text>`).join("");
  const pin = opt.cur != null ? `<circle class="pin" cx="${M.P[opt.cur][2]}" cy="${M.P[opt.cur][3] + fs * 0.3}" r="${fs * 0.5}" fill="var(--route)"/>` : "";
  return `<svg viewBox="${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}" role="img" aria-label="地図"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45) scale(${k})"><rect width="6" height="6" fill="#d9d4c7"/><rect width="2" height="6" fill="#9a9384"/></pattern></defs>${paths}${links}${rt}${pin}${labels}</svg>`;
}

function home() {
  const s = load(), k = todayKey(), done = s.days[k], hdone = s.hdays[k];
  for (const m of ["d", "h"]) { const r = s.runs[m]; if (r && r.res.length >= r.list.length) { MODE = m; return finish(); } }
  const nr = nextRank(s.trips);
  const rd = s.runs.d && s.runs.d.date === k ? s.runs.d : null, rh = s.runs.h && s.runs.h.date === k ? s.runs.h : null;
  const sample = { s: 2, g: 26, closed: [] };
  app.innerHTML = `
    <h1 class="title">都道府県リレー</h1>
    <div class="map" aria-hidden="true">${mapHtml(sample, { path: T.path(2, 26) || [], full: true })}</div>
    <p class="lead">となりの県だけを通って、目的の県へ。<br>だれでも同じ1日3問。</p>
    ${done ? `<div class="share">今日の結果　${done.r.map(sq).join("")}</div>` : ""}
    <button class="main" id="go-d">${done ? "今日の結果を見る" : rd ? `続きから（${rd.res.length + 1}問目）` : `今日の3問に出発 <small>#${dayNo(k)}</small>`}</button>
    ${done ? `<button class="main alt" id="go-h">${hdone ? "上級の結果を見る" : rh ? "上級の続きから" : "上級：地図なしの2問（ヒントなし）"}</button>` : ""}
    <div class="row"><button class="sub" id="go-p">練習（何度でも）</button><button class="sub" id="go-dex">県帳 ${Object.keys(s.seen).length}/${M.P.length}</button></div>
    <div class="stats"><div><b>${streak(s.days)}</b><small>連続の日</small></div><div><b>${Object.keys(s.days).length}</b><small>遊んだ日</small></div><div><b>${s.trips}</b><small>着いた旅</small></div></div>
    <p class="rank">称号：${rankOf(s.trips)}${nr ? `（あと${nr[0] - s.trips}回で${nr[1]}）` : ""}</p>
    ${footer()}`;
  $("go-d").onclick = () => (k !== todayKey() ? home() : done ? result("d", k) : startRun("d")); // 画面を開いたまま0時を過ぎたら、今日の状態に描き直す
  if ($("go-h")) $("go-h").onclick = () => (hdone ? result("h", k) : k === todayKey() ? startRun("h") : home()); // 画面を開いたまま0時を過ぎたら、翌日の上級は始めない
  $("go-p").onclick = practiceMenu;
  $("go-dex").onclick = dex;
  bindFooter();
  if (!s.tut) openHow();
}
function practiceMenu() {
  app.innerHTML = `<header><button class="icon" id="back" aria-label="もどる">←</button><h1>練習<small>今日の記録には入りません（県帳には載ります）</small></h1><span></span></header>
    <p class="note">種類を選ぶと、新しい問題が出ます。</p>
    <div class="lv">${[...T.LV, T.HARD].map((L, i) => `<button class="sub" data-lv="${i}" style="min-height:64px">${L.name}<br><small>${L.close ? "通れない県あり" : `${L.min}〜${L.max}県`}</small></button>`).join("")}</div>${footer()}`;
  $("back").onclick = home;
  document.querySelectorAll(".lv button").forEach((b) => (b.onclick = () => startRun("p", +b.dataset.lv)));
  bindFooter();
}
function startRun(mode, opt) {
  const k = todayKey();
  save((s) => {
    if (mode !== "p" && s.runs[mode] && s.runs[mode].date === k) return; // 続きから
    if ((mode === "d" && s.days[k]) || (mode === "h" && s.hdays[k])) return; // 別のタブで今日の分を終えていたら、もう一度は始めない（ホームに戻る）
    const list = mode === "d" ? dailyList(k) : mode === "h" ? hardList(k) : [{ seed: Math.floor(Math.random() * 2 ** 31), lv: opt }];
    s.runs[mode] = { mode, date: k, list, res: [], cur: null, id: Date.now().toString(36) };
  });
  MODE = mode;
  play();
}

// 今の問題：{ i, date, id, p, path:[県], moves, hints, hint, done, blind }
let cur = null;
function play() {
  const s = load(), run = s.runs[MODE];
  if (!run) return home();
  const i = run.res.length;
  if (i >= run.list.length) return finish();
  const it = run.list[i], p = probOf(it), blind = it.lv === 3;
  const saved = run.cur && run.cur.i === i ? run.cur : { path: [p.s], moves: 0, hints: 0 };
  const ok = valid(p, saved.path) && saved.moves >= saved.path.length - 1;
  cur = { i, date: run.date, id: run.id, it, p, path: ok ? saved.path.slice() : [p.s], moves: ok ? saved.moves : 0, hints: ok ? saved.hints || 0 : 0, hint: null, done: false, blind };
  const label = run.mode === "h" ? "上級・地図なし" : run.mode === "p" ? `練習・${p.lv}` : p.lv;
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="もどる">←</button>
      <div class="dots" aria-label="${i + 1}問目／${run.list.length}問">${run.list.map((_, j) => `<i class="${j < i ? "done" : j === i ? "on" : ""}"></i>`).join("")}</div>
      <span style="font-size:13px;color:var(--ink2)">${label} ${i + 1}/${run.list.length}</span></header>
    <div class="goal"><span class="from">出発<br><b>${T.name(p.s)}</b></span><span>→</span><span class="to" style="text-align:right">目的<br><b>${T.name(p.g)}</b></span></div>
    ${p.closed.length ? `<p class="note">通行止め：<b>${p.closed.map(T.name).join("・")}</b>は通れません</p>` : ""}
    <div class="map${blind ? " hide" : ""}" id="mp"><div class="blind">地図なし。県の位置を思い出して進もう</div></div>
    <div class="status"><span id="left"></span>${run.mode === "h" ? "<span>ヒントなし</span>" : `<button class="sub" id="hint" style="min-height:44px;padding:0 14px">ヒント</button>`}</div>
    <div class="trip" id="trip"></div>
    <div class="nexts" id="nx"></div>
    <div class="row"><button class="sub" id="undo">ひとつ戻る</button></div>
    <div id="after"></div>`;
  $("back").onclick = home;
  $("undo").onclick = undo;
  if ($("hint")) $("hint").onclick = hint;
  paint();
  window.scrollTo(0, 0);
}
// 保存してあった道が、この問題で正しいか（出発から、となりへ、通行止めを通らない）
function valid(p, path) {
  if (!Array.isArray(path) || !path.length || path[0] !== p.s) return false;
  for (let j = 1; j < path.length; j++) if (!Number.isInteger(path[j]) || !NB[path[j - 1]].includes(path[j]) || p.closed.includes(path[j])) return false;
  return !path.slice(0, -1).includes(p.g);
}
const same = (r) => r && cur && r.date === cur.date && r.id === cur.id && r.res.length === cur.i;
// 同じ問題で保存済みの道のほうが先なら、古いタブの道で上書きしない
function keep() { save((s) => { const r = s.runs[MODE]; if (same(r) && !(r.cur && r.cur.i === cur.i && r.cur.moves > cur.moves)) r.cur = { i: cur.i, path: cur.path, moves: cur.moves, hints: cur.hints }; }); }
function paint() {
  const p = cur.p, at = cur.path[cur.path.length - 1], nb = cur.done ? [] : NB[at];
  if (!cur.blind || cur.done) {
    $("mp").classList.toggle("hide", false);
    $("mp").innerHTML = mapHtml(p, { path: cur.path, cur: at, nb: nb.filter((x) => !p.closed.includes(x)), hint: cur.hint });
    $("mp").querySelectorAll("path[data-i]").forEach((e) => (e.onclick = () => { const j = +e.dataset.i; if (NB[cur.path[cur.path.length - 1]].includes(j)) go(j); }));
  }
  $("trip").innerHTML = cur.path.map((j, n) => `<b class="${n === 0 ? "s" : n === cur.path.length - 1 ? "c" : ""}">${T.short(j)}</b>`).join("<i>→</i>");
  $("nx").innerHTML = nb.map((j) => { const lk = linkOf(at, j), x = p.closed.includes(j); return `<button data-j="${j}" class="${j === cur.hint ? "hint" : ""}" ${x ? "disabled" : ""}>${T.short(j)}${x ? "<small>通行止め</small>" : lk ? `<small>${lk[2].split("・")[0]}</small>` : ""}</button>`; }).join("");
  $("nx").querySelectorAll("button[data-j]").forEach((b) => (b.onclick = () => go(+b.dataset.j)));
  $("left").textContent = cur.done ? "" : `進んだ回数 ${cur.moves}${cur.hints ? `・ヒント ${cur.hints}` : ""}`;
  $("undo").disabled = cur.done || cur.path.length <= 1;
  if ($("hint")) $("hint").disabled = cur.done || cur.hints >= 2;
}
function go(j) {
  if (cur.done) return;
  const at = cur.path[cur.path.length - 1];
  if (!NB[at].includes(j)) { toast("となりの県にだけ進めます"); buzz(30); return; }
  if (cur.p.closed.includes(j)) { toast(`${T.name(j)}は通行止めです`); buzz(30); return; }
  cur.path.push(j); cur.moves++; cur.hint = null; buzz(); keep(); paint();
  if (j === cur.p.g) arrive();
}
function undo() { if (cur.done || cur.path.length <= 1) return; cur.path.pop(); cur.hint = null; keep(); paint(); }
// ヒント：いまの県から、目的へいちばん近いとなりの県を光らせる
function hint() {
  if (cur.done || cur.hints >= 2) return;
  const at = cur.path[cur.path.length - 1], d = T.bfs(cur.p.g, cur.p.closed).d;
  const nx = NB[at].filter((x) => !cur.p.closed.includes(x) && d[x] === d[at] - 1)[0];
  if (nx == null) return;
  cur.hint = nx; cur.hints++; keep(); paint(); toast(`次は ${T.name(nx)} へ`);
}
function arrive() {
  if (!same(load().runs[MODE])) { toast("別の画面で先に進んでいます"); return play(); }
  cur.done = true; buzz([10, 40, 10]);
  const p = cur.p, rec = { m: cur.moves, d: p.d, h: cur.hints }, st = starsOf(rec);
  let saved = false;
  const s = save((s) => { const r = s.runs[MODE]; if (!same(r)) return; saved = true; r.res.push(rec); r.cur = null; s.trips++; for (const j of new Set(cur.path)) s.seen[T.name(j)] = (s.seen[T.name(j)] || 0) + 1; });
  if (!saved) { toast("別の画面で先に進んでいます"); return play(); }
  paint();
  const r = s.runs[MODE], fin = r && r.res.length >= r.list.length, best = T.path(p.s, p.g, p.closed);
  $("after").innerHTML = `<div class="verdict" role="status">
    <div class="hd">${T.short(p.g)}に到着！ ${starStr(st)}</div>
    <p class="note">${cur.moves === p.d ? `最短の${p.d}回で着きました。` : `${cur.moves}回で着きました（最短は${p.d}回）。`}最短の道は${p.ways}通り。<br>例：${best.map(T.short).join("→")}</p>
    <button class="main" id="next">${fin ? "結果を見る" : "次の問題へ"}</button></div>`;
  $("next").onclick = play;
  setTimeout(() => { if ($("next") && cur.done) $("next").scrollIntoView({ behavior: "smooth", block: "nearest" }); }, 60);
}

function finish() {
  const s = load(), run = s.runs[MODE];
  if (!run) return home();
  let first = false;
  const rec = { r: run.res.map((r) => ({ m: r.m, d: r.d, h: r.h })) };
  save((s2) => {
    first = bank(s2, run);
    // 別のタブで同じモードの新しい回が始まっていたら、それは消さない
    const c = s2.runs[MODE]; if (c && c.date === run.date && c.id === run.id) s2.runs[MODE] = null;
  });
  if (run.mode === "p") return result("p", run.date, false, { list: run.list, ...rec });
  result(run.mode, run.date, first);
}
// 共有の文：県の名前（答え）は出さない。最短🟩・2回まで遠回り🟨・それ以上🟧、ヒントを使ったら💡
const sq = (r) => (r.h ? "💡" : r.m === r.d ? "🟩" : r.m - r.d <= 2 ? "🟨" : "🟧");
function shareText(mode, k, rec) {
  const all = rec.r.every((r) => r.m === r.d && !r.h);
  return `都道府県リレー${mode === "h" ? " 地図なし" : ""} #${dayNo(k)} ${md(k)}\n${rec.r.map(sq).join("")}${all ? " 全部最短" : ""}`;
}
function untilNext() { const n = jstNow(), ms = 864e5 - (n.getTime() % 864e5); return `${Math.floor(ms / 36e5)}時間${Math.floor((ms % 36e5) / 6e4)}分`; }
function result(mode, k, first, prec) {
  const s = load();
  const list = mode === "p" ? prec.list : mode === "d" ? dailyList(k) : hardList(k);
  const rec = mode === "p" ? prec : (mode === "d" ? s.days : s.hdays)[k];
  if (!rec) return home();
  const all = rec.r.every((r) => r.m === r.d && !r.h), text = shareText(mode, k, rec);
  const showKofi = first && mode !== "p" && all && !s.kofi[k + mode];
  if (showKofi) save((s2) => { s2.kofi[k + mode] = 1; });
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>都道府県リレー<small>${mode === "d" ? `今日の3問 #${dayNo(k)}` : mode === "h" ? "上級：地図なし" : "練習"}</small></h1><span></span></header>
    <p class="big">${all ? "全部、最短で到着！" : `${list.length}問 到着`}</p>
    <div class="res">${list.map((it, j) => { const p = probOf(it), r = rec.r[j]; return `<div><span>${T.short(p.s)} → ${T.short(p.g)}<br><small style="color:var(--ink2)">${r.m}回（最短${r.d}回）${r.h ? `・ヒント${r.h}` : ""}</small></span>${starStr(starsOf(r))}</div>`; }).join("")}</div>
    ${mode !== "p" ? `<div class="share">${esc(text)}</div>
    <button class="main" id="share">結果をシェア</button>
    <div class="shares"><a id="toX" target="_blank" rel="noopener">Xで投稿</a><a id="toLine" target="_blank" rel="noopener">LINEで送る</a><button id="copy">コピー</button></div>
    <p class="note">🟩最短　🟨2回まで遠回り　🟧もっと遠回り　💡ヒント<br>次の3問まで あと <b>${untilNext()}</b></p>` : ""}
    ${mode === "d" && k === todayKey() && !s.hdays[k] ? `<button class="main alt" id="go-h">上級：地図なしの2問に挑む</button>` : ""}
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">県帳を見る</button></div>
    ${showKofi ? `<p class="note kofi">楽しめたら、<a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi でコーヒー1杯の応援</a>をもらえると、新しいゲームづくりの励みになります（任意・遊ぶのはずっと無料）。</p>` : ""}
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home;
  $("go-p").onclick = practiceMenu;
  $("go-dex").onclick = dex;
  if ($("go-h")) $("go-h").onclick = () => (k === todayKey() ? startRun("h") : home()); // 画面を開いたまま0時を過ぎたら、翌日の上級は始めない
  if (mode !== "p") {
    const withUrl = text + "\n" + SITE;
    $("toX").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(withUrl);
    $("toLine").href = "https://line.me/R/share?text=" + encodeURIComponent(withUrl);
    const copy = (t) => { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("コピーしました"), () => toast("コピーできませんでした")); };
    $("copy").onclick = () => copy(withUrl);
    $("share").onclick = () => { if (navigator.share) navigator.share({ text: withUrl }).catch(() => {}); else copy(withUrl); };
  }
}

function dex() {
  const s = load(), got = M.P.filter((q) => s.seen[q[0]]).length;
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>県帳<small>${got}/${M.P.length}県・着いた旅 ${s.trips}</small></h1><span></span></header>
    <p class="note">通った県が集まります（出発と目的も入ります）。</p>
    <div class="dex">${M.P.map((q) => `<div class="${s.seen[q[0]] ? "" : "no"}">${q[0].replace(/(都|府|県)$/, "")}<small>${s.seen[q[0]] ? s.seen[q[0]] + "回" : "まだ"}</small></div>`).join("")}</div>
    ${footer()}`;
  $("back").onclick = home;
  bindFooter();
}

window.__td = { mapHtml, mode: () => MODE, T, dailyList, hardList, probOf, starsOf, todayKey, dayNo, shareText, streak, load, valid, cur: () => cur, go: (j) => go(j), play: (m) => { if (m) MODE = m; play(); } };
home();
if ("serviceWorker" in navigator && location.protocol === "https:" && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
